<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How to Play Against Every Champion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0d7c6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0a0a0f;
    }

    .splash-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: rgba(10, 10, 15, 0.45);
      background-blend-mode: multiply;
      transition: background-image 0.15s ease;
    }

    .splash-background.no-splash {
      background-image: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(10, 10, 15, 0.85);
      padding: 1rem 2rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid #2a2a3a;
      flex-shrink: 0;
      backdrop-filter: blur(5px);
    }

    header h1 {
      font-size: 2rem;
      color: #c8aa6e;
      text-shadow: 0 0 10px rgba(200, 170, 110, 0.3);
      margin-bottom: 0.8rem;
    }

    .header-search {
      max-width: 400px;
      margin: 0 auto;
    }

    .header-search input {
      width: 100%;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      border: 1px solid #4a3e2c;
      background: #1b1b2a;
      color: #f0e6d2;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .header-search input::placeholder {
      color: #6b5e4a;
    }

    .header-search input:focus {
      border-color: #c8aa6e;
    }

    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .champion-sidebar {
      width: 300px;
      min-width: 300px;
      background: rgba(17, 17, 24, 0.75);
      border-right: 1px solid #2a2a3a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .champion-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .champion-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.4rem 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      border: 2px solid transparent;
      background: rgba(27, 27, 42, 0.7);
    }

    .champion-item:hover {
      background: rgba(36, 36, 58, 0.85);
      border-color: #c8aa6e;
    }

    .champion-item.active {
      border-color: #f0b27a;
      box-shadow: 0 0 10px rgba(240, 178, 122, 0.4);
    }

    .champion-item img {
      width: 96px;
      height: 96px;
      border-radius: 12px;
      object-fit: cover;
      background: #0f0f1a;
      border: 2px solid #4a3e2c;
      flex-shrink: 0;
    }

    .champion-item span {
      font-size: 1rem;
      font-weight: 600;
      color: #f0e6d2;
      white-space: nowrap;
    }

    .no-results {
      padding: 1rem;
      color: #6b5e4a;
      text-align: center;
    }

    .info-panel {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      background: rgba(13, 13, 20, 0.7);
      backdrop-filter: blur(4px);
    }

    .placeholder-message {
      text-align: center;
      margin-top: 5rem;
      font-size: 1.3rem;
      color: #5a5244;
    }

    .champion-detail {
      max-width: 900px;
      margin: 0 auto;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .champion-detail h2 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #c8aa6e;
      border-bottom: 1px solid #2e2e3a;
      padding-bottom: 0.3rem;
    }

    .info-slot {
      background: rgba(27, 27, 42, 0.7);
      border: 1px solid #2e2e3a;
      border-radius: 10px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      backdrop-filter: blur(4px);
    }

    .info-slot h3 {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b7a62;
      margin-bottom: 0.6rem;
    }

    .info-slot p {
      color: #ddd6c8;
      line-height: 1.5;
    }

    .difficulty-badge {
      display: inline-block;
      padding: 0.2rem 1rem;
      border-radius: 20px;
      font-weight: bold;
    }

    .phases-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    .phase-slot {
      flex: 1;
      background: rgba(27, 27, 42, 0.7);
      border: 1px solid #2e2e3a;
      border-radius: 10px;
      padding: 1rem;
      backdrop-filter: blur(4px);
    }

    .phase-slot h4 {
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.85rem;
      color: #c8aa6e;
      margin-bottom: 0.5rem;
    }

    .phase-slot p {
      color: #ddd6c8;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .items-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 0.5rem;
    }

    .item-icon {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      border: 2px solid #4a3e2c;
      background: #0f0f1a;
      object-fit: cover;
      transition: transform 0.15s, border-color 0.15s;
    }

    .item-icon:hover {
      transform: scale(1.1);
      border-color: #c8aa6e;
    }

    .build-image {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #3a3a4a;
      margin-top: 0.5rem;
    }

    /* ----- Full rune tree styles (local images) ----- */
    .rune-page {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .rune-tree {
      flex: 1;
      min-width: 200px;
      background: rgba(27, 27, 42, 0.4);
      border: 1px solid #2e2e3a;
      border-radius: 12px;
      padding: 1rem;
      backdrop-filter: blur(4px);
    }

    .rune-tree h4 {
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.9rem;
      color: #c8aa6e;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tree-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }

    .rune-slot-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }

    .rune-slot-row.keystone-row {
      margin-bottom: 12px;
    }

    .rune-option {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #4a3e2c;
      background: #0a0a0f;
      object-fit: contain;
      transition: transform 0.15s;
    }

    .rune-option.selected {
      border-color: #c8aa6e;
      filter: none;
      opacity: 1;
    }

    .rune-option.unselected {
      filter: grayscale(100%) brightness(0.6);
      opacity: 0.5;
    }

    .keystone-option {
      width: 60px;
      height: 60px;
    }

    .secondary-runes {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .secondary-rune {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid #4a3e2c;
      background: #0a0a0f;
      object-fit: contain;
    }

    .secondary-rune.selected {
      border-color: #c8aa6e;
    }

    .stats-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .stats-row img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #4a3e2c;
      background: #0a0a0f;
    }

    @media (max-width: 700px) {
      .main-layout {
        flex-direction: column;
        overflow: hidden;
      }
      .champion-sidebar {
        width: 100%;
        min-width: unset;
        height: auto;
        max-height: 50vh;
        flex-shrink: 0;
        border-right: none;
        border-bottom: 1px solid #2a2a3a;
      }
      .champion-list {
        flex-direction: row;
        flex-wrap: wrap;
        overflow-y: auto;
      }
      .champion-item {
        flex-shrink: 0;
        flex-direction: column;
        align-items: center;
        gap: 0.2rem;
        padding: 0.2rem;
        border: none;
        background: none;
        min-width: 90px;
      }
      .champion-item img {
        width: 64px;
        height: 64px;
      }
      .champion-item span {
        font-size: 0.7rem;
      }
      .phases-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div id="splash-bg" class="splash-background no-splash"></div>

  <header>
    <h1>⚔️ How to Play Against Every Champion</h1>
    <div class="header-search">
      <input type="text" id="search-input" placeholder="🔍 Search champion..." autocomplete="off" />
    </div>
  </header>

  <div class="main-layout">
    <div class="champion-sidebar">
      <div id="champion-list" class="champion-list"></div>
    </div>
    <div id="info-panel" class="info-panel">
      <p class="placeholder-message">👈 Click a champion to see matchup info</p>
    </div>
  </div>

  <script>
    // ---------- GLOBALS ----------
    let allChampionItems = [];
    const dataCache = {};
    let runeData = null;          // holds the full runesReforged.json data
    let runeMap = {};             // flat map of rune ID -> rune info (includes name, icon)

    // ---------- FETCH RUNE DEFINITIONS (once) ----------
    (async function loadRuneData() {
      try {
        const versionsRes = await fetch('https://ddragon.leagueoflegends.com/api/versions.json');
        const versions = await versionsRes.json();
        const latestVersion = versions[0];
        const runesRes = await fetch(`https://ddragon.leagueoflegends.com/cdn/${latestVersion}/data/en_US/runesReforged.json`);
        runeData = await runesRes.json();
        // Build flat map for easy lookup
        runeData.forEach(tree => {
          tree.slots.forEach(slot => {
            slot.runes.forEach(rune => {
              runeMap[rune.id] = {
                ...rune,
                iconUrl: `https://ddragon.leagueoflegends.com/cdn/img/${rune.icon}`   // for fallback (not used now)
              };
            });
          });
        });
      } catch (e) {
        console.error('Failed to load rune data', e);
      }
    })();

    // ---------- SAFE FILE NAME HELPER (mimics fetch-runes.js) ----------
    function safeFileName(name) {
      return name
        .trim()
        .replace(/[^a-zA-Z0-9 \-\'\.]/g, '')
        .replace(/\s+/g, '_')
        .replace(/'/g, '')
        .replace(/\.+/g, '_')
        .replace(/_+/g, '_')
        .replace(/^_|_$/g, '')
        || 'unknown';
    }

    // ---------- BUILD CHAMPION LIST ----------
    (async () => {
      const championList = document.getElementById('champion-list');

      try {
        const versionsRes = await fetch('https://ddragon.leagueoflegends.com/api/versions.json');
        const versions = await versionsRes.json();
        const latestVersion = versions[0];

        const champsRes = await fetch(
          `https://ddragon.leagueoflegends.com/cdn/${latestVersion}/data/en_US/champion.json`
        );
        const champsData = await champsRes.json();
        const champions = Object.values(champsData.data);

        champions.forEach(champ => {
          const item = document.createElement('div');
          item.className = 'champion-item';
          item.dataset.championId = champ.id;
          item.dataset.championName = champ.name.toLowerCase();

          const img = document.createElement('img');
          img.src = `https://ddragon.leagueoflegends.com/cdn/${latestVersion}/img/champion/${champ.image.full}`;
          img.alt = champ.name;
          img.loading = 'lazy';

          const nameSpan = document.createElement('span');
          nameSpan.textContent = champ.name;

          item.appendChild(img);
          item.appendChild(nameSpan);

          item.addEventListener('click', () => {
            document.querySelectorAll('.champion-item').forEach(el => el.classList.remove('active'));
            item.classList.add('active');
            loadChampionInfo(champ.id, champ.name);
          });

          championList.appendChild(item);
          allChampionItems.push(item);
        });

        preloadSplashImages(champions);
        setupSearch();

      } catch (error) {
        championList.innerHTML = '<p style="color:red;padding:1rem;">❌ Could not load champions.</p>';
        console.error(error);
      }
    })();

    function preloadSplashImages(champions) {
      champions.forEach(champ => {
        const img = new Image();
        img.src = `https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${champ.id}_0.jpg`;
      });
    }

    function setupSearch() {
      const searchInput = document.getElementById('search-input');
      const championList = document.getElementById('champion-list');

      searchInput.addEventListener('input', () => {
        const query = searchInput.value.toLowerCase().trim();
        let visibleCount = 0;

        allChampionItems.forEach(item => {
          const name = item.dataset.championName;
          if (query === '' || name.includes(query)) {
            item.style.display = 'flex';
            visibleCount++;
          } else {
            item.style.display = 'none';
          }
        });

        let noResultsEl = document.querySelector('.no-results');
        if (visibleCount === 0) {
          if (!noResultsEl) {
            noResultsEl = document.createElement('p');
            noResultsEl.className = 'no-results';
            noResultsEl.textContent = 'No champions found.';
            championList.appendChild(noResultsEl);
          }
        } else {
          if (noResultsEl) noResultsEl.remove();
        }
      });
    }

    function getDifficultyColor(value) {
      if (value >= 10) return { bg: '#cc0000', text: 'white' };
      if (value >= 9)  return { bg: '#ea4335', text: 'white' };
      if (value >= 8)  return { bg: '#ea6435', text: 'white' };
      if (value >= 7)  return { bg: '#e69138', text: 'white' };
      if (value >= 6)  return { bg: '#f1c232', text: 'black' };
      if (value >= 5)  return { bg: '#ffd966', text: 'black' };
      if (value >= 4)  return { bg: '#d7e455', text: 'black' };
      if (value >= 3)  return { bg: '#90d542', text: 'black' };
      if (value >= 2)  return { bg: '#4da029', text: 'white' };
      return              { bg: '#337432', text: 'white' };
    }

    function setSplashBackground(championId) {
      const splashBg = document.getElementById('splash-bg');
      if (!championId) {
        splashBg.style.backgroundImage = '';
        splashBg.classList.add('no-splash');
        return;
      }
      const splashUrl = `https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${championId}_0.jpg`;
      splashBg.style.backgroundImage = `url('${splashUrl}')`;
      splashBg.classList.remove('no-splash');
    }

    async function loadChampionInfo(championId, championName) {
      const infoPanel = document.getElementById('info-panel');
      infoPanel.innerHTML = `<div class="champion-detail"><h2>${championName}</h2><p class="placeholder-message">⏳ Loading guide...</p></div>`;
      setSplashBackground(championId);

      let data;
      if (dataCache[championId]) {
        data = dataCache[championId];
      } else {
        try {
          const res = await fetch(`champions/${championId}.json`);
          if (!res.ok) throw new Error('Not found');
          data = await res.json();
          dataCache[championId] = data;
        } catch (err) {
          data = null;
        }
      }

      renderChampionInfo(championId, championName, data);
    }

// ---------- FULL RUNE PAGE RENDERER (local images, with CDN fallback) ----------
function renderFullRunePage(runes) {
  if (!runeData || !runes.primary) return '';

  // Helper to get a rune image path (tries local first, then CDN fallback)
  function getRuneImagePath(runeName) {
    const localPath = `images/runes/${safeFileName(runeName)}.png`;
    // We can't check file existence from browser, so we'll use local path.
    // If it doesn't exist, browser will show broken image – that's acceptable.
    return localPath;
  }

  // Tree icon – try local, if missing the browser will show nothing; we could add fallback
  function getTreeIconPath(treeName) {
    return `images/runes/${safeFileName(treeName)}.png`;
  }

  const primaryTree = runeData.find(t => t.name === runes.primary.style);
  const secondaryTree = runes.secondary ? runeData.find(t => t.name === runes.secondary.style) : null;

  let html = '';

  // ----- Primary tree -----
  if (primaryTree) {
    html += `<div class="rune-tree">`;
    html += `<h4><img src="${getTreeIconPath(primaryTree.name)}" class="tree-icon" alt=""/>${primaryTree.name}</h4>`;

    // Keystone row (slot 0)
    const keystoneSlot = primaryTree.slots[0];
    html += `<div class="rune-slot-row keystone-row">`;
    keystoneSlot.runes.forEach(rune => {
      const isSelected = rune.name === runes.primary.keystone;
      html += `<img src="${getRuneImagePath(rune.name)}" class="rune-option keystone-option ${isSelected ? 'selected' : 'unselected'}" alt="${rune.name}" loading="lazy"/>`;
    });
    html += `</div>`;

    // Rows 1-3
    for (let i = 1; i <= 3; i++) {
      const slot = primaryTree.slots[i];
      if (!slot) continue;
      const selectedKey = i === 1 ? runes.primary.row1 : (i === 2 ? runes.primary.row2 : runes.primary.row3);
      html += `<div class="rune-slot-row">`;
      slot.runes.forEach(rune => {
        const isSelected = rune.name === selectedKey;
        html += `<img src="${getRuneImagePath(rune.name)}" class="rune-option ${isSelected ? 'selected' : 'unselected'}" alt="${rune.name}" loading="lazy"/>`;
      });
      html += `</div>`;
    }

    html += `</div>`; // end primary tree
  }

  // ----- Secondary tree (now shows all rows) -----
  if (secondaryTree && runes.secondary) {
    html += `<div class="rune-tree">`;
    html += `<h4><img src="${getTreeIconPath(secondaryTree.name)}" class="tree-icon" alt=""/>${secondaryTree.name}</h4>`;

    // Secondary tree has slots 1-3 (no keystone)
    for (let i = 1; i <= 3; i++) {
      const slot = secondaryTree.slots[i];
      if (!slot) continue;
      html += `<div class="rune-slot-row">`;
      slot.runes.forEach(rune => {
        // Check if this rune is one of the two selected
        const isSelected = rune.name === runes.secondary.rune1 || rune.name === runes.secondary.rune2;
        html += `<img src="${getRuneImagePath(rune.name)}" class="rune-option ${isSelected ? 'selected' : 'unselected'}" alt="${rune.name}" loading="lazy"/>`;
      });
      html += `</div>`;
    }

    html += `</div>`; // end secondary tree
  }

  // Combine the two trees side by side
  const treeHTML = `<div class="rune-page">${html}</div>`;

  // ----- Stat shards (placed below the trees) -----
  let statsHTML = '';
  if (runes.stats && Array.isArray(runes.stats) && runes.stats.length > 0) {
    statsHTML = `<div class="stats-row">`;
    runes.stats.forEach(statUrl => {
      statsHTML += `<img src="${statUrl}" alt="Stat" loading="lazy"/>`;
    });
    statsHTML += `</div>`;
  }

  return treeHTML + statsHTML;
}
  </script>
</body>
</html>
