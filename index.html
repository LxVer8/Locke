<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Locke Bible</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0d7c6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0a0a0f;
    }

    .splash-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: rgba(10, 10, 15, 0.45);
      background-blend-mode: multiply;
      transition: background-image 0.15s ease;
      /* Default background is set inline in the HTML */
    }

    .splash-background.no-splash {
      background-image: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(10, 10, 15, 0.85);
      padding: 1rem 2rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid #2a2a3a;
      flex-shrink: 0;
      backdrop-filter: blur(5px);
    }

    header h1 {
      font-size: 2rem;
      color: #c8aa6e;
      text-shadow: 0 0 10px rgba(200, 170, 110, 0.3);
      margin-bottom: 0.8rem;
    }

    .header-search {
      max-width: 400px;
      margin: 0 auto;
    }

    .header-search input {
      width: 100%;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      border: 1px solid #4a3e2c;
      background: #1b1b2a;
      color: #f0e6d2;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .header-search input::placeholder {
      color: #6b5e4a;
    }

    .header-search input:focus {
      border-color: #c8aa6e;
    }

    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .champion-sidebar {
      width: 300px;
      min-width: 300px;
      background: rgba(17, 17, 24, 0.75);
      border-right: 1px solid #2a2a3a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .champion-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .champion-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.4rem 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      border: 2px solid transparent;
      background: rgba(27, 27, 42, 0.7);
    }

    .champion-item:hover {
      background: rgba(36, 36, 58, 0.85);
      border-color: #c8aa6e;
    }

    .champion-item.active {
      border-color: #f0b27a;
      box-shadow: 0 0 10px rgba(240, 178, 122, 0.4);
    }

    .champion-item img {
      width: 96px;
      height: 96px;
      border-radius: 12px;
      object-fit: cover;
      background: #0f0f1a;
      border: 2px solid #4a3e2c;
      flex-shrink: 0;
    }

    .champion-item span {
      font-size: 1rem;
      font-weight: 600;
      color: #f0e6d2;
      white-space: nowrap;
    }

    .no-results {
      padding: 1rem;
      color: #6b5e4a;
      text-align: center;
    }

    .info-panel {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      background: rgba(13, 13, 20, 0.7);
      backdrop-filter: blur(4px);
      position: relative;
    }

    .info-panel.loading::after {
      content: "";
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(200, 170, 110, 0.25);
      border-top-color: #c8aa6e;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      z-index: 5;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .placeholder-message {
      text-align: center;
      margin-top: 5rem;
      font-size: 1.3rem;
      color: #5a5244;
    }

    .champion-detail {
      max-width: 900px;
      margin: 0 auto;
    }

    .champion-detail h2 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #c8aa6e;
      border-bottom: 1px solid #2e2e3a;
      padding-bottom: 0.3rem;
    }

    .info-slot {
      background: rgba(27, 27, 42, 0.7);
      border: 1px solid #2e2e3a;
      border-radius: 10px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      backdrop-filter: blur(4px);
    }

    .info-slot h3 {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b7a62;
      margin-bottom: 0.6rem;
    }

    .info-slot p {
      color: #ddd6c8;
      line-height: 1.5;
    }

    .difficulty-badge {
      display: inline-block;
      padding: 0.2rem 1rem;
      border-radius: 20px;
      font-weight: bold;
    }

    .phases-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    .phase-slot {
      flex: 1;
      background: rgba(27, 27, 42, 0.7);
      border: 1px solid #2e2e3a;
      border-radius: 10px;
      padding: 1rem;
      backdrop-filter: blur(4px);
    }

    .phase-slot h4 {
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.85rem;
      color: #c8aa6e;
      margin-bottom: 0.5rem;
    }

    .phase-slot p {
      color: #ddd6c8;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .items-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 0.5rem;
    }

    .item-icon {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      border: 2px solid #4a3e2c;
      background: #0f0f1a;
      object-fit: cover;
      transition: transform 0.15s, border-color 0.15s;
    }

    .item-icon:hover {
      transform: scale(1.1);
      border-color: #c8aa6e;
    }

    .build-image {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #3a3a4a;
      margin-top: 0.5rem;
    }

    /* ----- Full rune tree styles ----- */
    .rune-page {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .rune-tree {
      flex: 1 1 160px;
      min-width: 160px;
      background: rgba(27, 27, 42, 0.4);
      border: 1px solid #2e2e3a;
      border-radius: 12px;
      padding: 1rem;
      backdrop-filter: blur(4px);
    }

    .rune-tree h4 {
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.85rem;
      color: #c8aa6e;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tree-icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }

    .rune-slot-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
    }

    .rune-slot-row.keystone-row {
      margin-bottom: 8px;
    }

    .rune-option {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #4a3e2c;
      background: #0a0a0f;
      object-fit: contain;
      transition: transform 0.15s;
    }

    .rune-option.selected {
      border-color: #c8aa6e;
      filter: none;
      opacity: 1;
    }

    .rune-option.unselected {
      filter: grayscale(100%) brightness(0.6);
      opacity: 0.5;
    }

    .keystone-option {
      width: 52px;
      height: 52px;
    }

    .stats-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @media (max-width: 700px) {
      .main-layout {
        flex-direction: column;
        overflow: hidden;
      }
      .champion-sidebar {
        width: 100%;
        min-width: unset;
        height: auto;
        max-height: 50vh;
        flex-shrink: 0;
        border-right: none;
        border-bottom: 1px solid #2a2a3a;
      }
      .champion-list {
        flex-direction: row;
        flex-wrap: wrap;
        overflow-y: auto;
      }
      .champion-item {
        flex-shrink: 0;
        flex-direction: column;
        align-items: center;
        gap: 0.2rem;
        padding: 0.2rem;
        border: none;
        background: none;
        min-width: 90px;
      }
      .champion-item img {
        width: 64px;
        height: 64px;
      }
      .champion-item span {
        font-size: 0.7rem;
      }
      .phases-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <!-- Default splash: High Noon Locke (change the path if your file name is different) -->
  <div id="splash-bg" class="splash-background" style="background-image: url('images/splashes/High_Noon_Locke.jpg');"></div>

  <header>
    <h1>The Locke Bible</h1>
    <div class="header-search">
      <input type="text" id="search-input" placeholder="Search champion..." autocomplete="off" />
    </div>
  </header>

  <div class="main-layout">
    <div class="champion-sidebar">
      <div id="champion-list" class="champion-list"></div>
    </div>
    <div id="info-panel" class="info-panel">
      <p class="placeholder-message">Click a champion to see matchup info</p>
    </div>
  </div>

  <script>
    // ---------- GLOBALS ----------
    let allChampionItems = [];
    const dataCache = {};
    const championSearchTerms = {};
    let runeData = null;
    let runeMap = {};
    let currentPatchVersion = '';

    // Custom splash overrides (Fiddlesticks uses new splash)
    const CUSTOM_SPLASHES = {
      "Fiddlesticks": "images/splashes/Fiddlesticks.jpg"
    };

    // Abbreviations mapping
    const ABBREVIATIONS = [
      "Aurelion Sol asol",
      "Bel'Veth belveth bv",
      "Cho'Gath chogath",
      "Dr Mundo mundo doctor",
      "Gangplank gp",
      "Jarvan IV IV j4",
      "Kai'Sa kaisa ks",
      "Kha'Zix khazix kz",
      "Kog'Maw kogmaw km",
      "K'Sante ksante ks",
      "LeBlanc lb",
      "Master Yi yi",
      "Miss Fortune mf",
      "Reksai rek'sai rs",
      "renata glasc rg",
      "Tahm Kench tk",
      "Twisted Fate tf",
      "Vel'Koz velkoz vk"
    ];

    const ABBREV_TO_CHAMP = {
      "asol": "Aurelion Sol",
      "belveth": "Bel'Veth",
      "bv": "Bel'Veth",
      "chogath": "Cho'Gath",
      "mundo": "Dr. Mundo",
      "doctor": "Dr. Mundo",
      "gp": "Gangplank",
      "IV": "Jarvan IV",
      "j4": "Jarvan IV",
      "kaisa": "Kai'Sa",
      "ks": ["Kai'Sa", "K'Sante"],
      "khazix": "Kha'Zix",
      "kz": "Kha'Zix",
      "kogmaw": "Kog'Maw",
      "km": "Kog'Maw",
      "ksante": "K'Sante",
      "lb": "LeBlanc",
      "yi": "Master Yi",
      "mf": "Miss Fortune",
      "rek'sai": "Rek'Sai",
      "rs": "Rek'Sai",
      "rg": "Renata Glasc",
      "tk": "Tahm Kench",
      "tf": "Twisted Fate",
      "velkoz": "Vel'Koz",
      "vk": "Vel'Koz"
    };

    const STAT_ROWS = [
      {
        options: [
          { name: "Adaptive Force", file: "Adaptive_Force" },
          { name: "Attack Speed", file: "Attack_Speed" },
          { name: "Ability Haste", file: "Ability_Haste" }
        ]
      },
      {
        options: [
          { name: "Adaptive Force", file: "Adaptive_Force" },
          { name: "Movement Speed", file: "Movement_Speed" },
          { name: "Health Scaling", file: "Health_Scaling" }
        ]
      },
      {
        options: [
          { name: "Health Flat", file: "Health_Flat" },
          { name: "Tenacity", file: "Tenacity" },
          { name: "Health Scaling", file: "Health_Scaling" }
        ]
      }
    ];

    // Load rune definitions
    (async function loadRuneData() {
      try {
        const versionsRes = await fetch('https://ddragon.leagueoflegends.com/api/versions.json');
        const versions = await versionsRes.json();
        const latestVersion = versions[0];
        const runesRes = await fetch(`https://ddragon.leagueoflegends.com/cdn/${latestVersion}/data/en_US/runesReforged.json`);
        runeData = await runesRes.json();
        runeData.forEach(tree => {
          tree.slots.forEach(slot => {
            slot.runes.forEach(rune => {
              runeMap[rune.id] = { ...rune };
            });
          });
        });
      } catch (e) {
        console.error('Failed to load rune data:', e);
      }
    })();

    function safeFileName(name) {
      return name
        .trim()
        .replace(/[^a-zA-Z0-9 \-\'\.]/g, '')
        .replace(/\s+/g, '_')
        .replace(/'/g, '')
        .replace(/\.+/g, '_')
        .replace(/_+/g, '_')
        .replace(/^_|_$/g, '')
        || 'unknown';
    }

    // Build champion list
    (async () => {
      const championList = document.getElementById('champion-list');

      try {
        const versionsRes = await fetch('https://ddragon.leagueoflegends.com/api/versions.json');
        const versions = await versionsRes.json();
        const latestVersion = versions[0];
        currentPatchVersion = latestVersion;

        const champsRes = await fetch(
          `https://ddragon.leagueoflegends.com/cdn/${latestVersion}/data/en_US/champion.json`
        );
        const champsData = await champsRes.json();
        const champions = Object.values(champsData.data);

        champions.forEach(champ => {
          const item = document.createElement('div');
          item.className = 'champion-item';
          item.dataset.championId = champ.id;
          item.dataset.championName = champ.name.toLowerCase();

          const searchTerms = new Set();
          searchTerms.add(champ.name.toLowerCase());

          for (const [abbr, target] of Object.entries(ABBREV_TO_CHAMP)) {
            if (Array.isArray(target)) {
              if (target.some(t => t.toLowerCase() === champ.name.toLowerCase())) {
                searchTerms.add(abbr.toLowerCase());
              }
            } else {
              if (target.toLowerCase() === champ.name.toLowerCase()) {
                searchTerms.add(abbr.toLowerCase());
              }
            }
          }
          championSearchTerms[champ.id] = Array.from(searchTerms);

          const img = document.createElement('img');
          img.src = `https://ddragon.leagueoflegends.com/cdn/${latestVersion}/img/champion/${champ.image.full}`;
          img.alt = champ.name;
          img.loading = 'lazy';

          const nameSpan = document.createElement('span');
          nameSpan.textContent = champ.name;

          item.appendChild(img);
          item.appendChild(nameSpan);

          item.addEventListener('click', () => {
            document.querySelectorAll('.champion-item').forEach(el => el.classList.remove('active'));
            item.classList.add('active');
            loadChampionInfo(champ.id, champ.name);
          });

          championList.appendChild(item);
          allChampionItems.push(item);
        });

        preloadSplashImages(champions);
        setupSearch();

      } catch (error) {
        championList.innerHTML = '<p style="color:red;padding:1rem;">Could not load champions.</p>';
        console.error(error);
      }
    })();

    function preloadSplashImages(champions) {
      champions.forEach(champ => {
        const img = new Image();
        img.src = CUSTOM_SPLASHES[champ.id] ||
                  `https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${champ.id}_0.jpg?v=${currentPatchVersion}`;
      });
    }

    function setupSearch() {
      const searchInput = document.getElementById('search-input');
      const championList = document.getElementById('champion-list');

      searchInput.addEventListener('input', () => {
        const query = searchInput.value.toLowerCase().trim();
        let visibleCount = 0;

        allChampionItems.forEach(item => {
          const terms = championSearchTerms[item.dataset.championId] || [item.dataset.championName];
          const matches = query === '' || terms.some(term => term.includes(query));
          if (matches) {
            item.style.display = 'flex';
            visibleCount++;
          } else {
            item.style.display = 'none';
          }
        });

        let noResultsEl = document.querySelector('.no-results');
        if (visibleCount === 0) {
          if (!noResultsEl) {
            noResultsEl = document.createElement('p');
            noResultsEl.className = 'no-results';
            noResultsEl.textContent = 'No champions found.';
            championList.appendChild(noResultsEl);
          }
        } else {
          if (noResultsEl) noResultsEl.remove();
        }
      });
    }

    function getDifficultyColor(value) {
      if (value >= 10) return { bg: '#cc0000', text: 'black' };
      if (value >= 9)  return { bg: '#ea4335', text: 'black' };
      if (value >= 8)  return { bg: '#ea6435', text: 'black' };
      if (value >= 7)  return { bg: '#e69138', text: 'black' };
      if (value >= 6)  return { bg: '#f1c232', text: 'black' };
      if (value >= 5)  return { bg: '#ffd966', text: 'black' };
      if (value >= 4)  return { bg: '#d7e455', text: 'black' };
      if (value >= 3)  return { bg: '#90d542', text: 'black' };
      if (value >= 2)  return { bg: '#4da029', text: 'black' };
      return              { bg: '#337432', text: 'black' };
    }

    function setSplashBackground(championId) {
      const splashBg = document.getElementById('splash-bg');
      if (!championId) {
        // Reset to default High Noon Locke
        splashBg.style.backgroundImage = "url('images/splashes/High_Noon_Locke.jpg')";
        splashBg.classList.add('no-splash');
        return;
      }
      // Use custom splash if available, otherwise CDN
      const splashUrl = CUSTOM_SPLASHES[championId] ||
        `https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${championId}_0.jpg?v=${currentPatchVersion}`;
      splashBg.style.backgroundImage = `url('${splashUrl}')`;
      splashBg.classList.remove('no-splash');
    }

    // --- Subtle loading indicator ---
    async function loadChampionInfo(championId, championName) {
      const infoPanel = document.getElementById('info-panel');
      setSplashBackground(championId);

      let data;
      if (dataCache[championId]) {
        data = dataCache[championId];
      } else {
        let loadingTimer = setTimeout(() => {
          infoPanel.classList.add('loading');
        }, 300);

        try {
          const res = await fetch(`champions/${championId}.json`);
          if (!res.ok) throw new Error('Not found');
          data = await res.json();
          dataCache[championId] = data;
        } catch (err) {
          data = null;
        } finally {
          clearTimeout(loadingTimer);
          infoPanel.classList.remove('loading');
        }
      }

      renderChampionInfo(championId, championName, data);
    }

    // ---------- FULL RUNE PAGE RENDERER (unchanged) ----------
    function renderFullRunePage(runes) {
      if (!runeData || !runes.primary) return '';

      const primaryTree = runeData.find(t => t.name === runes.primary.style);
      const secondaryTree = runes.secondary ? runeData.find(t => t.name === runes.secondary.style) : null;

      function getRuneImagePath(runeName) {
        return `images/runes/${safeFileName(runeName)}.png`;
      }

      function getTreeIconPath(treeName) {
        return `images/runes/${safeFileName(treeName)}.png`;
      }

      let html = '';

      if (primaryTree) {
        html += `<div class="rune-tree">`;
        html += `<h4><img src="${getTreeIconPath(primaryTree.name)}" class="tree-icon" alt=""/>${primaryTree.name}</h4>`;

        const keystoneSlot = primaryTree.slots[0];
        html += `<div class="rune-slot-row keystone-row">`;
        keystoneSlot.runes.forEach(rune => {
          const isSelected = rune.name === runes.primary.keystone;
          html += `<img src="${getRuneImagePath(rune.name)}" class="rune-option keystone-option ${isSelected ? 'selected' : 'unselected'}" alt="${rune.name}" loading="lazy"/>`;
        });
        html += `</div>`;

        for (let i = 1; i <= 3; i++) {
          const slot = primaryTree.slots[i];
          if (!slot) continue;
          const selectedKey = i === 1 ? runes.primary.row1 : (i === 2 ? runes.primary.row2 : runes.primary.row3);
          html += `<div class="rune-slot-row">`;
          slot.runes.forEach(rune => {
            const isSelected = rune.name === selectedKey;
            html += `<img src="${getRuneImagePath(rune.name)}" class="rune-option ${isSelected ? 'selected' : 'unselected'}" alt="${rune.name}" loading="lazy"/>`;
          });
          html += `</div>`;
        }

        html += `</div>`;
      }

      if (secondaryTree && runes.secondary) {
        html += `<div class="rune-tree">`;
        html += `<h4><img src="${getTreeIconPath(secondaryTree.name)}" class="tree-icon" alt=""/>${secondaryTree.name}</h4>`;

        for (let i = 1; i <= 3; i++) {
          const slot = secondaryTree.slots[i];
          if (!slot) continue;
          html += `<div class="rune-slot-row">`;
          slot.runes.forEach(rune => {
            const isSelected = rune.name === runes.secondary.rune1 || rune.name === runes.secondary.rune2;
            html += `<img src="${getRuneImagePath(rune.name)}" class="rune-option ${isSelected ? 'selected' : 'unselected'}" alt="${rune.name}" loading="lazy"/>`;
          });
          html += `</div>`;
        }

        html += `</div>`;
      }

      let statsTreeHTML = '';
      if (runes.stats && Array.isArray(runes.stats) && runes.stats.length > 0) {
        statsTreeHTML = `<div class="rune-tree">`;
        statsTreeHTML += `<h4>Shards</h4>`;
        statsTreeHTML += `<div class="stats-container">`;
        for (let rowIdx = 0; rowIdx < STAT_ROWS.length; rowIdx++) {
          const rowOptions = STAT_ROWS[rowIdx].options;
          const selectedPath = runes.stats[rowIdx] || '';
          const selectedBase = selectedPath.split('/').pop().replace('.png', '');

          statsTreeHTML += `<div class="rune-slot-row">`;
          rowOptions.forEach(opt => {
            const isSelected = (opt.file === selectedBase);
            const imgPath = `images/runes/${opt.file}.png`;
            statsTreeHTML += `<img src="${imgPath}" class="rune-option ${isSelected ? 'selected' : 'unselected'}" alt="${opt.name}" loading="lazy"/>`;
          });
          statsTreeHTML += `</div>`;
        }
        statsTreeHTML += `</div></div>`;
      }

      return `<div class="rune-page">${html}${statsTreeHTML}</div>`;
    }

    // ---------- RENDER FULL CHAMPION INFO ----------
    function renderChampionInfo(championId, championName, data) {
      const infoPanel = document.getElementById('info-panel');

      let html = `<div class="champion-detail">`;
      html += `<h2>${championName}</h2>`;

      if (data) {
        const diffNum = parseFloat(data.difficulty);
        if (!isNaN(diffNum)) {
          const { bg, text } = getDifficultyColor(diffNum);
          html += `<div class="info-slot"><h3>Matchup Difficulty</h3><span class="difficulty-badge" style="background-color: ${bg}; color: ${text};">${diffNum} / 10</span></div>`;
        } else {
          html += `<div class="info-slot"><h3>Matchup Difficulty</h3><span class="difficulty-badge" style="background:#2a2a18; color:#f0c27a;">${data.difficulty || '?'}</span></div>`;
        }

        html += `<div class="info-slot"><h3>General Tip</h3><p>${data.generalTip || ''}</p></div>`;

        html += `<div class="phases-row">`;
        html += `<div class="phase-slot"><h4>Levels 1‑5</h4><p>${data.earlyGame || 'No info yet.'}</p></div>`;
        html += `<div class="phase-slot"><h4>Levels 6‑10</h4><p>${data.midGame || 'No info yet.'}</p></div>`;
        html += `<div class="phase-slot"><h4>Levels 11‑18</h4><p>${data.lateGame || 'No info yet.'}</p></div>`;
        html += `</div>`;

        // Items
        if (data.items) {
          if (typeof data.items === 'object' && !Array.isArray(data.items)) {
            html += `<div class="info-slot"><h3>Recommended Items</h3><div class="phases-row">`;
            const itemPhases = ['starter', 'core', 'situational'];
            const labels = ['Starter Items', 'Core Items', 'Situational Items'];
            itemPhases.forEach((phase, idx) => {
              const phaseItems = data.items[phase] || [];
              html += `<div class="phase-slot"><h4>${labels[idx]}</h4><div class="items-row">`;
              phaseItems.forEach(url => {
                html += `<img src="${url}" alt="Item" class="item-icon" loading="lazy" />`;
              });
              html += `</div></div>`;
            });
            html += `</div></div>`;
          } else if (Array.isArray(data.items) && data.items.length > 0) {
            html += `<div class="info-slot"><h3>Recommended Items</h3><div class="items-row">`;
            data.items.forEach(url => {
              html += `<img src="${url}" alt="Item" class="item-icon" loading="lazy" />`;
            });
            html += `</div></div>`;
          }
        } else if (data.itemsImage) {
          html += `<div class="info-slot"><h3>Recommended Items</h3>`;
          html += `<img src="${data.itemsImage}" alt="Items vs ${championName}" class="build-image" loading="lazy" />`;
          html += `</div>`;
        }

        // Runes
        html += `<div class="info-slot"><h3>Recommended Runes</h3>`;
        try {
          if (data.runes) {
            if (data.runes.primary && data.runes.primary.style) {
              html += renderFullRunePage(data.runes);
            } else if (Array.isArray(data.runes)) {
              html += `<div class="items-row">`;
              data.runes.forEach(runeUrl => {
                html += `<img src="${runeUrl}" alt="Rune" class="item-icon" loading="lazy" />`;
              });
              html += `</div>`;
            } else {
              html += `<p>Rune data format not recognised.</p>`;
            }
          } else {
            html += `<p>No runes configured yet.</p>`;
          }
        } catch (err) {
          console.error('Error rendering runes:', err);
          html += `<p style="color:red;">Could not display runes – check console for details.</p>`;
        }
        html += `</div>`;

        html += `<div class="info-slot"><h3>Matchup Note</h3><p>${data.matchupNote || ''}</p></div>`;
      } else {
        html += `<div class="info-slot"><h3>Coming Soon</h3><p>No guide written yet.</p></div>`;
      }

      infoPanel.innerHTML = html;
    }
  </script>
</body>
</html>
