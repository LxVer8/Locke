name: Update LP Leaderboard

on:
  schedule:
    - cron: '0 * * * *'      # every hour
  workflow_dispatch:          # manual trigger from Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch LP from Riot API
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: node fetch-lp.js

      - name: Commit and push leaderboard.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add leaderboard.json
          git diff --staged --quiet || (git commit -m "Update leaderboard [skip ci]" && git push)
